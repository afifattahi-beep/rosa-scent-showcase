/* =========================================================
   DESIGN TOKENS & BASE
   ========================================================= */
:root {
  --ivory: #FAF6EF;
  --ivory-deep: #F2E8D9;
  --burgundy: #6B1E2E;
  --burgundy-dark: #4A1320;
  --rose-gold: #B76E79;
  --rose-gold-light: #E8C4BC;
  --ink: #1C1718;
  --muted: #6E6264;
  --line: rgba(107,30,46,0.15);
  --shadow: 0 25px 50px -12px rgba(74,19,32,0.25);
  --serif: 'Cormorant Garamond', Georgia, serif;
  --sans: 'Montserrat', system-ui, sans-serif;
  --ease: cubic-bezier(.22, .61, .36, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--sans);
  font-weight: 300;
  color: var(--ink);
  background: var(--ivory);
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
body.locked { overflow: hidden; }

h1, h2, h3, h4 { font-family: var(--serif); font-weight: 500; letter-spacing: 0.01em; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
.container { width: min(1180px, 90%); margin: auto; }

.btn {

  text-transform: uppercase;
  font-weight: 500;

  transition: all 0.4s var(--ease);
  background: transparent;
}
.btn:hover { background: var(--burgundy); color: var(--ivory); }
.btn-solid { background: var(--burgundy); color: var(--ivory); }
.btn-solid:hover { background: var(--burgundy-dark); border-color: var(--burgundy-dark); }
.btn-block { width: 100%; text-align: center; }

.section-head h2 { font-size: clamp(2.2rem, 5vw, 3.2rem); color: var(--burgundy); line-height: 1.15; margin-top: 0.6rem; }

.nav { position: fixed; inset: 0 0 auto; z-index: 50; transition: all 0.4s var(--ease); padding: 1.4rem 0; }

}
